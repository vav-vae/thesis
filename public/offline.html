<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>LiBot — You’re offline</title>
  <style>
    :root { color-scheme: light; font-family: system-ui,-apple-system,"Segoe UI",sans-serif; background:#f8fafc; color:#0f172a; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
    main { width:min(100%, 480px); box-sizing:border-box; padding:40px 32px; text-align:center; background:white; border:1px solid #e2e8f0; border-radius:24px; box-shadow:0 20px 50px #0f172a14; }
    .mark { width:64px; height:64px; margin:0 auto 20px; display:grid; place-items:center; border-radius:16px; background:#0f766e; color:white; font-size:28px; font-weight:700; }
    .brand { margin:0 0 8px; color:#0f766e; font-size:12px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:0; font-size:30px; letter-spacing:-.02em; } p { margin:16px 0 0; color:#475569; line-height:1.6; }
    button { margin-top:28px; padding:12px 20px; border:0; border-radius:12px; background:#0f766e; color:white; font:600 15px system-ui; cursor:pointer; }
  </style>
</head>
<body><main><div class="mark">L</div><p class="brand">LiBot</p><h1>You’re offline</h1><p>LiBot could not reach the network. Reconnect to continue managing listings, schedules, and virtual tours.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
